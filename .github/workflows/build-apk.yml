name: Build CATUR SUARA V2 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Stockfish for Android arm64 (offline engine)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK"
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Android Bionic provides pthread symbols without a separate libpthread.
          sed -i 's/-lpthread//g' /tmp/stockfish/src/Makefile
          if grep -n -- '-lpthread' /tmp/stockfish/src/Makefile; then
            echo "ERROR: -lpthread remains in Stockfish Makefile" >&2
            exit 1
          fi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          make -C /tmp/stockfish/src -j2 build ARCH=armv8 COMP=clang \
            CXX="$TOOL/aarch64-linux-android26-clang++" \
            CC="$TOOL/aarch64-linux-android26-clang" \
            EXTRALDFLAGS='-Wl,-z,max-page-size=16384'
          cp /tmp/stockfish/src/stockfish app/src/main/jniLibs/arm64-v8a/libstockfish.so
          file app/src/main/jniLibs/arm64-v8a/libstockfish.so
          test -s app/src/main/jniLibs/arm64-v8a/libstockfish.so
          file app/src/main/jniLibs/arm64-v8a/libstockfish.so | grep -q 'ELF 64-bit' 
      - name: Build V2 APK
        run: gradle assembleDebug --stacktrace
      - name: Verify Stockfish is packaged in APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | tee /tmp/catur-apk-files.txt
          grep -q 'lib/arm64-v8a/libstockfish.so' /tmp/catur-apk-files.txt || {
            echo 'ERROR: Stockfish engine is missing from the APK.' >&2
            exit 1
          }
          unzip -p "$APK" lib/arm64-v8a/libstockfish.so | head -c 4 | od -An -tx1 | grep -q '7f 45 4c 46' || {
            echo 'ERROR: Stockfish is not a valid ELF binary.' >&2
            exit 1
          }
      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CATUR_SUARA_V2_APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
