name: Build CATUR SUARA V2 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Stockfish ARM64 offline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOL/aarch64-linux-android26-clang++"
          sed -i 's/-lpthread//g' /tmp/stockfish/src/Makefile
          make -C /tmp/stockfish/src -j2 build ARCH=armv8 COMP=clang \
            CXX="$TOOL/aarch64-linux-android26-clang++" \
            CC="$TOOL/aarch64-linux-android26-clang" \
            EXTRALDFLAGS='-Wl,-z,max-page-size=16384'
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/stockfish/src/stockfish app/src/main/jniLibs/arm64-v8a/libstockfish.so
          file app/src/main/jniLibs/arm64-v8a/libstockfish.so
          test -s app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Build V2 APK
        run: gradle assembleDebug --stacktrace
      - name: Verify engine inside APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          import glob, zipfile, struct
          apks=glob.glob('app/build/outputs/apk/debug/*.apk')
          assert apks, 'No APK produced'
          with zipfile.ZipFile(apks[0]) as z:
              path='lib/arm64-v8a/libstockfish.so'
              assert path in z.namelist(), 'Stockfish missing from APK'
              data=z.read(path)
              assert data[:4]==b'\x7fELF', 'Stockfish is not ELF'
              assert data[4]==2, 'Stockfish must be 64-bit'
              assert struct.unpack('<H',data[18:20])[0]==183, 'Stockfish must target ARM64'
              print('OK: ARM64 Stockfish packaged:', len(data), 'bytes')
          PYVERIFY
      - name: Upload CATUR SUARA V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CATUR_SUARA_V2_APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
